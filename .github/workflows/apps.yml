name: Apps

# Builds Pawse for sideloading: an unsigned IPA (SideStore) and a release-signed APK, plus the
# desktop app (Mac, Windows, Linux). Tag `v1.2.3` publishes a GitHub Release and updates sources/sidestore.json.
on:
  workflow_dispatch:
    inputs:
      app:
        description: App folder under apps/
        type: choice
        options: [pawse]
        default: pawse
      platforms:
        description: Platforms to build
        type: choice
        options: [ios, android, both]
        default: both
  push:
    tags: ['v*']
    # Builds on main (no release) save the shared caches; tag builds can only read caches from main.
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'tooling/ci/**'
      - '.github/workflows/apps.yml'

permissions:
  contents: write

# electron-builder fetches its own Electron for each target, so installs skip the dev binary.
env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

concurrency:
  group: apps-${{ github.ref }}-${{ inputs.app }}
  # A newer push to main supersedes a running cache build; releases always finish.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.meta.outputs.app }}
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      version_code: ${{ steps.meta.outputs.version_code }}
      skia: ${{ steps.meta.outputs.skia }}
      ios: ${{ steps.meta.outputs.ios }}
      android: ${{ steps.meta.outputs.android }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        env:
          INPUT_APP: ${{ inputs.app }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
        run: node tooling/ci/apps.mjs meta

  ios:
    needs: meta
    if: needs.meta.outputs.ios == 'true'
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      APP: ${{ needs.meta.outputs.app }}
      APP_NAME: ${{ needs.meta.outputs.name }}
      VERSION: ${{ needs.meta.outputs.version }}
      VERSION_CODE: ${{ needs.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      # Expo SDK 57's ExpoModulesJSI headers use Xcode 27's Swift/C++ interop annotations; Xcode 26 rejects them.
      - name: Select Xcode 27+
        run: |
          echo "Installed:"; ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_2[7-9]*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE" ]; then echo "No Xcode 27+ on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          swift --version

      # Uses the version pinned in the root package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pnpm skips dependency postinstall scripts, so copy Skia's prebuilt binaries explicitly.
      - name: Install Skia prebuilt libraries
        if: needs.meta.outputs.skia == 'true'
        working-directory: apps/${{ env.APP }}
        run: pnpm exec install-skia

      - name: Stamp version
        run: node tooling/ci/apps.mjs stamp

      - name: Generate the native iOS project
        working-directory: apps/${{ env.APP }}
        run: pnpm exec expo prebuild -p ios --clean --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: apps/${{ env.APP }}/ios/Pods
          # Podfile.lock doesn't exist before pod install, so key on what decides the pods.
          key: pods-${{ env.APP }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', format('apps/{0}/package.json', env.APP)) }}
          restore-keys: pods-${{ env.APP }}-${{ runner.os }}-

      # Compiler cache: native code that didn't change is reused instead of rebuilt.
      - name: Set up ccache
        run: |
          command -v ccache >/dev/null || brew install ccache
          echo "CCACHE_DIR=$HOME/Library/Caches/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_SLOPPINESS=clang_index_store,file_stat_matches,include_file_ctime,include_file_mtime,ivfsoverlay,pch_defines,modules,system_headers,time_macros" >> "$GITHUB_ENV"
          echo "CCACHE_FILECLONE=true" >> "$GITHUB_ENV"
          echo "CCACHE_DEPEND=true" >> "$GITHUB_ENV"
          echo "CCACHE_INODECACHE=true" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=3G" >> "$GITHUB_ENV"
          mkdir -p "$HOME/Library/Caches/ccache"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ env.APP }}-${{ github.sha }}
          restore-keys: ccache-ios-${{ env.APP }}-

      - name: Install pods
        working-directory: apps/${{ env.APP }}
        run: cd ios && pod install && ccache -z

      - name: Archive (unsigned)
        working-directory: apps/${{ env.APP }}
        run: |
          set -o pipefail
          mkdir -p build
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          if ! xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$APP_NAME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            REACT_NATIVE_PATH="$GITHUB_WORKSPACE/node_modules/react-native" \
            > build/xcodebuild.log 2>&1; then
            echo "::group::Errors"; grep -nE "error:|fatal error|\*\* ARCHIVE FAILED" build/xcodebuild.log | head -n 60; echo "::endgroup::"
            tail -n 80 build/xcodebuild.log
            exit 1
          fi
          tail -n 20 build/xcodebuild.log

      - name: Compiler cache stats
        if: always()
        run: ccache -s -v || true

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: apps/${{ env.APP }}/build/xcodebuild.log
          if-no-files-found: ignore

      # Ad-hoc signing (inside-out) lets SideStore read the App Group entitlements before it re-signs.
      - name: Ad-hoc codesign
        working-directory: apps/${{ env.APP }}
        run: node ../../tooling/ci/apps.mjs codesign-ios

      - name: Package IPA
        working-directory: apps/${{ env.APP }}
        run: |
          APP_BUNDLE=$(ls -d build/App.xcarchive/Products/Applications/*.app | head -n 1)
          mkdir -p build/ipa/Payload
          cp -R "$APP_BUNDLE" build/ipa/Payload/
          (cd build/ipa && zip -qry "../${APP_NAME}-${VERSION}.ipa" Payload)
          ls -lh "build/${APP_NAME}-${VERSION}.ipa"

      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: apps/${{ env.APP }}/build/${{ env.APP_NAME }}-${{ env.VERSION }}.ipa
          if-no-files-found: error

  android:
    needs: meta
    if: needs.meta.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP: ${{ needs.meta.outputs.app }}
      APP_NAME: ${{ needs.meta.outputs.name }}
      VERSION: ${{ needs.meta.outputs.version }}
      VERSION_CODE: ${{ needs.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # RN 0.86's Gradle plugin pins jvmToolchain(17) and AGP 8.12 / Gradle 9.3 need 17+, so stay on 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: pnpm install --frozen-lockfile

      - name: Install Skia prebuilt libraries
        if: needs.meta.outputs.skia == 'true'
        working-directory: apps/${{ env.APP }}
        run: pnpm exec install-skia

      - name: Stamp version
        run: node tooling/ci/apps.mjs stamp

      - name: Generate the native Android project
        working-directory: apps/${{ env.APP }}
        run: pnpm exec expo prebuild -p android --clean --no-install

      # RN 0.86 pins NDK 27.1 and build-tools 36; the runner image may lack them, so install them up front.
      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | sudo env "JAVA_HOME=$JAVA_HOME" "$SDKM" --licenses > /dev/null || true
          sudo env "JAVA_HOME=$JAVA_HOME" "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1" \
            || echo "::warning::sdkmanager failed; AGP will try to download the missing packages itself."

      # Public-repo Linux runners have 4 cores: a bigger heap, parallel work and the Gradle build cache; arm64 only for sideloading.
      - name: Tune Gradle
        working-directory: apps/${{ env.APP }}/android
        run: |
          cat >> gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          kotlin.compiler.execution.strategy=in-process
          org.gradle.caching=true
          org.gradle.parallel=true
          reactNativeArchitectures=arm64-v8a
          EOF
          # Lint-vital only re-checks the app and can run out of memory on a large module graph.
          cat > "$RUNNER_TEMP/ci.init.gradle" <<'EOF'
          allprojects {
            tasks.configureEach { t -> if (t.name.startsWith("lintVital")) t.enabled = false }
          }
          EOF

      # Without the keystore secrets the APK stays debug-signed and cannot update a release-signed install.
      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; building a debug-signed APK."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          node tooling/ci/apps.mjs sign-android "apps/$APP/android/app/build.gradle"

      - name: Build APK
        working-directory: apps/${{ env.APP }}/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --max-workers=4 --stacktrace -I "$RUNNER_TEMP/ci.init.gradle"

      - name: Rename APK
        working-directory: apps/${{ env.APP }}
        run: |
          mkdir -p build
          cp android/app/build/outputs/apk/release/app-release.apk "build/${APP_NAME}-${VERSION}.apk"
          ls -lh "build/${APP_NAME}-${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: apps/${{ env.APP }}/build/${{ env.APP_NAME }}-${{ env.VERSION }}.apk
          if-no-files-found: error

  # The desktop app wraps one web export; it is built once and packaged on each system.
  desktop-web:
    needs: meta
    if: needs.meta.outputs.app == 'pawse'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pawse-desktop run web
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-web
          path: apps/desktop/web
          if-no-files-found: error

  desktop:
    needs: [meta, desktop-web]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      # No Apple or Windows certificates: the Mac app is ad-hoc signed, Windows unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: desktop-web
          path: apps/desktop/web
      - name: Stamp version
        run: node -e "const f='apps/desktop/package.json',fs=require('fs'),p=JSON.parse(fs.readFileSync(f));p.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - name: Package
        working-directory: apps/desktop
        run: pnpm exec electron-builder --publish never
      - name: List installers
        run: ls -lh apps/desktop/dist
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
          if-no-files-found: error

  release:
    needs: [meta, ios, android, desktop]
    # A release ships both phone apps or neither; desktop installers join only when their builds pass.
    if: always() && needs.meta.outputs.release == 'true' && needs.ios.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    env:
      APP: ${{ needs.meta.outputs.app }}
      APP_NAME: ${{ needs.meta.outputs.name }}
      VERSION: ${{ needs.meta.outputs.version }}
      VERSION_CODE: ${{ needs.meta.outputs.version_code }}
      TAG: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/download-artifact@v4
        with:
          pattern: '{ipa,apk,installer-*}'
          path: dist
          merge-multiple: true

      # Release notes come from the app's CHANGELOG.md at the tagged commit (Keep a Changelog format).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          path: tagged
          sparse-checkout: apps/${{ env.APP }}/CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Release notes
        run: |
          f="tagged/apps/${APP}/CHANGELOG.md"
          if [ -f "$f" ]; then
            awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## / {exit} on {print}' "$f" > notes.md
          fi
          [ -s notes.md ] || echo "${APP_NAME} ${VERSION}." > notes.md
          cat notes.md

      # Stable names next to the versioned files: releases/latest/download/Pawse.ipa always works.
      - name: Stable copies
        run: |
          for f in dist/${APP_NAME}-*.ipa dist/${APP_NAME}-*.apk; do [ -e "$f" ] || continue; cp "$f" "dist/${APP_NAME}.${f##*.}"; done
          # Desktop: drop the version, e.g. Pawse-mac-arm64.dmg, Pawse-Setup.exe, Pawse-linux-x86_64.AppImage.
          for f in dist/${APP_NAME}-*-mac-*.dmg dist/${APP_NAME}-Setup-*.exe dist/${APP_NAME}-*-linux-*; do
            [ -e "$f" ] || continue
            cp "$f" "$(echo "$f" | sed -E "s/-${VERSION//./\\.}//")"
          done
          ls dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.APP_NAME }} ${{ env.VERSION }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/*.ipa
            dist/*.apk
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: false

      - name: Update the SideStore source
        if: hashFiles('dist/*.ipa') != ''
        run: |
          node tooling/ci/apps.mjs sidestore "dist/${APP_NAME}-${VERSION}.ipa"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/sidestore.json
          git diff --cached --quiet && exit 0
          git commit -m "chore(sources): ${APP_NAME} ${VERSION} in the SideStore source"
          for i in 1 2 3; do git pull --rebase origin "$DEFAULT_BRANCH" && git push origin "HEAD:$DEFAULT_BRANCH" && exit 0; sleep 5; done
          exit 1
