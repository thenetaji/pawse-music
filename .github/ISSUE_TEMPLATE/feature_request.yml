name: Feature request
description: An idea to make Flow better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the need first, then the idea.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried or seen elsewhere
