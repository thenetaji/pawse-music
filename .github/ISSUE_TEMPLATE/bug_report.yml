name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Flow version
      description: Settings → About
      placeholder: "0.3.1"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone and OS version
      placeholder: "iPhone 15, iOS 27.0 / Pixel 8, Android 16"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics log
      description: For playback problems, Settings → About → Diagnostics → Copy diagnostics, then paste here.
      render: text
